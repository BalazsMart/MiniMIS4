<!DOCTYPE html>
<html>
<head>
  <title>MiniMIS</title>

  <style>
    body{
      font-family: Arial;
      background:#f4f6f8;
      text-align:center;
    }

    .box{
      background:white;
      padding:20px;
      margin:20px auto;
      width:950px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    table{
      width:100%;
      border-collapse:collapse;
    }

    th, td{
      border:1px solid #ddd;
      padding:8px;
      font-size:12px;
      text-align:center;
      position:relative;
    }

    th{
      background:#007bff;
      color:white;
    }

    input{
      padding:10px;
      width:200px;
      margin:5px;
    }

    button{
      padding:6px 10px;
      font-size:12px;
      margin:2px;
      cursor:pointer;
    }

    .mark{
      position:absolute;
      top:2px;
      right:3px;
      font-size:10px;
    }

  </style>
</head>

<body>

<h1>🏫 MiniMIS</h1>

<!-- LOGIN -->
<div class="box" id="loginBox">
  <h3>Login</h3>
  <input id="user" placeholder="Username"><br>
  <input id="pass" type="password" placeholder="Password"><br>
  <button onclick="login()">Login</button>
</div>

<!-- REGISTER -->
<div class="box" id="dashboard" style="display:none;">
  <h2>Year 7A Register</h2>

  <table>
    <tr>
      <th>Student</th>
      <th>M</th>
      <th>T</th>
      <th>W</th>
      <th>TH</th>
      <th>F</th>
    </tr>

    <tbody id="rows"></tbody>
  </table>
</div>

<script>

const students = [
"Lea Abdullahi","Sofia Alexa","Jayden Beckley","Charlie Bergin",
"Caillo Bowyer","Pheobe Bistrow","Poppy Brown","Aizah Butt",
"Juljeta Cakiqi","Simon Donaldson","Anu Ghale","Molly Giles",
"Jacob Glancy","Sworup Gurung","Devon Harris","Seden Ibrahim",
"Ayana Joshi","Rowan Key","Alexander Ledger","Arabella Lock",
"Paul Marcolino","Leticia Nyitambe","Areeba Safra","Avyan Sharma",
"Khristana Shatokhina","Dylan Stephens","Lilly Sykes","Rex Thapa",
"Reem Yawermann"
];

// LOGIN
function login(){
  let u=document.getElementById("user").value;
  let p=document.getElementById("pass").value;

  if(u==="teacher" && p==="1234"){
    document.getElementById("loginBox").style.display="none";
    document.getElementById("dashboard").style.display="block";
    load();
  } else {
    alert("Wrong login");
  }
}

// LOAD REGISTER
function load(){
  let rows=document.getElementById("rows");

  students.forEach(name=>{
    let tr=document.createElement("tr");

    tr.innerHTML=`
      <td>${name}</td>
      <td onclick="mark(this)"></td>
      <td onclick="mark(this)"></td>
      <td onclick="mark(this)"></td>
      <td onclick="mark(this)"></td>
      <td onclick="mark(this)"></td>
    `;

    rows.appendChild(tr);
  });
}

// MARK ATTENDANCE
function mark(cell){
  let c=prompt("P=Present\nL=Late\nA=Absent");

  if(c==="P") cell.innerHTML="<span class='mark'>✓</span>";
  if(c==="L") cell.innerHTML="<span class='mark'>L</span>";
  if(c==="A"){
    let r=prompt("Reason: Medical / Dental / Off Site / Other");
    cell.innerHTML="<span class='mark'>✗</span>";
    cell.title=r;
  }
}

</script>

</body>
</html>
