<!DOCTYPE html>
<html>
<head>
  <title>MiniMIS Attendance</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f6f8;
      text-align: center;
    }
    .login-box, .dashboard {
      background: white;
      padding: 20px;
      margin: 30px auto;
      width: 400px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input {
      padding: 10px;
      width: 90%;
      margin: 5px;
    }
    button {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .present { background-color: #4CAF50; color: white; }
    .late { background-color: #FFC107; color: white; }
    .absent { background-color: #F44336; color: white; }
    .student {
      margin: 10px 0;
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }
  </style>
</head>
<body>

<h1>🏫 MiniMIS</h1>

<!-- Login -->
<div class="login-box" id="loginBox">
  <h3>Login</h3>
  <input type="text" id="username" placeholder="Username"><br>
  <input type="password" id="password" placeholder="Password"><br>
  <button onclick="login()">Login</button>
  <p class="error" id="errorMsg" style="color:red"></p>
</div>

<!-- Dashboard -->
<div class="dashboard" id="dashboard" style="display:none;">
  <h2>Attendance Dashboard</h2>
  <div id="studentsList"></div>
</div>

<script>
// --- Login ---
function login() {
  let user = document.getElementById("username").value;
  let pass = document.getElementById("password").value;
  let correctUser = "teacher";
  let correctPass = "1234";

  if(user === correctUser && pass === correctPass) {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    loadStudents();
  } else {
    document.getElementById("errorMsg").innerText = "Incorrect username or password";
  }
}

// --- Students ---
const students = [
  "Lea Abdullahi","Sofia Alexa","Jayden Beckley","Charlie Bergin","Caillo Bowyer",
  "Pheobe Bistrow","Poppy Brown","Aizah Butt","Juljeta Cakiqi","Simon Donaldson",
  "Anu Ghale","Molly Giles","Jacob Glancy","Sworup Gurung","Devon Harris",
  "Seden Ibrahim","Ayana Joshi","Rowan Key","Alexander Ledger","Arabella Lock",
  "Paul Marcolino","Leticia Nyitambe","Areeba Safra","Avyan Sharma","Khristana Shatokhina",
  "Dylan Stephens","Lilly Sykes","Rex Thapa","Reem Yawermann"
];

function loadStudents() {
  const container = document.getElementById("studentsList");
  container.innerHTML = "";
  students.forEach(name => {
    const studentDiv = document.createElement("div");
    studentDiv.className = "student";
    studentDiv.innerHTML = `
      <strong>${name}</strong><br>
      <button class="present" onclick="mark('${name}','Present')">Present</button>
      <button class="late" onclick="mark('${name}','Late')">Late</button>
      <button class="absent" onclick="mark('${name}','Absent')">Absent</button>
      <span id="${name.replaceAll(' ','_')}_status"></span>
    `;
    container.appendChild(studentDiv);
  });
}

// --- Attendance ---
function mark(name, status) {
  const statusSpan = document.getElementById(name.replaceAll(' ','_') + "_status");
  statusSpan.innerText = ` ${status}`;
}
</script>

</body>
</html>
