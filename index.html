<!DOCTYPE html>
<html>
<head>
  <title>MiniMIS Pro</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f6f8;
      text-align: center;
    }

    .box {
      background: white;
      padding: 20px;
      margin: 20px auto;
      width: 900px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input {
      padding: 10px;
      width: 80%;
      margin: 5px;
    }

    button {
      padding: 5px 8px;
      margin: 2px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
    }

    .present { background: #4CAF50; color: white; }
    .late { background: #FFC107; color: white; }
    .absent { background: #F44336; color: white; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 6px;
      text-align: center;
      position: relative;
    }

    th {
      background: #007bff;
      color: white;
    }

    .mark {
      font-size: 10px;
      position: absolute;
      top: 2px;
      right: 3px;
    }
  </style>
</head>

<body>

<h1>🏫 MiniMIS Pro</h1>

<!-- LOGIN -->
<div class="box" id="loginBox">
  <h3>Login</h3>
  <input id="user" placeholder="Username"><br>
  <input id="pass" type="password" placeholder="Password"><br>
  <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div class="box" id="dashboard" style="display:none;">
  <h2>Year 7A Register</h2>

  <table>
    <tr>
      <th>Student</th>
      <th>M</th>
      <th>T</th>
      <th>W</th>
      <th>TH</th>
      <th>F</th>
    </tr>

    <tbody id="rows"></tbody>

  </table>
</div>

<script>

const students = [
"Lea Abdullahi","Sofia Alexa","Jayden Beckley","Charlie Bergin",
"Caillo Bowyer","Pheobe Bistrow","Poppy Brown","Aizah Butt",
"Juljeta Cakiqi","Simon Donaldson","Anu Ghale","Molly Giles",
"Jacob Glancy","Sworup Gurung","Devon Harris","Seden Ibrahim",
"Ayana Joshi","Rowan Key","Alexander Ledger","Arabella Lock",
"Paul Marcolino","Leticia Nyitambe","Areeba Safra","Avyan Sharma",
"Khristana Shatokhina","Dylan Stephens","Lilly Sykes","Rex Thapa",
"Reem Yawermann"
];

// LOGIN
function login(){
  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  if(u === "teacher" && p === "1234"){
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    load();
  } else {
    alert("Wrong login");
  }
}

// LOAD TABLE
function load(){
  let rows = document.getElementById("rows");

  students.forEach(name => {

    let tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${name}</td>
      <td onclick="mark(this)"></td>
      <td onclick="mark(this)"></td>
      <td onclick="mark(this)"></td>
      <td onclick="mark(this)"></td>
      <td onclick="mark(this)"></td>
    `;

    rows.appendChild(tr);
  });
}

// MARK ATTENDANCE
function mark(cell){

  let choice = prompt(
    "P = Present\nL = Late\nA = Absent"
  );

  if(choice === "P"){
    cell.innerHTML = "<span class='mark'>✓</span>";
  }

  else if(choice === "L"){
    cell.innerHTML = "<span class='mark'>L</span>";
  }

  else if(choice === "A"){
    let reason = prompt(
      "Reason:\nMedical\nDental\nEducated Off Site\nOther"
    );

    cell.innerHTML = "<span class='mark'>✗</span>";
    cell.title = reason;
  }
}

</script>

</body>
</html>
